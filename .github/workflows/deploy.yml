name: Deploy with Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Deploy Docker Container
        run: |
          docker compose down --remove-orphans || true
          docker compose up --build -d --remove-orphans