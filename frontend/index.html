<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Stack App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #005999;
        }
        pre {
            background: #2d2d2d;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
        }
        li { margin: 8px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Panel Full-Stack</h2>
        <p>Frontend (Nginx) comunicándose con Backend (Node.js API)</p>
        <button id="btnFetch">Consultar API</button>
    </div>

    <div class="card">
        <h3>Respuesta del Backend:</h3>
        <pre id="apiStatus">Haz clic en "Consultar API" para cargar datos...</pre>
        <ul id="taskList"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
