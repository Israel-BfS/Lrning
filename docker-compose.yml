version: '3.8'

services:
  # Servicio Frontend + Reverse Proxy Nginx
  frontend:
    image: nginx:alpine
    container_name: app-frontend
    restart: always
    ports:
      - "8083:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api

  # Servicio Backend Node.js API
  backend-api:
    build:
      context: ./backend
    container_name: app-backend
    restart: always
    expose:
      - "3000"